org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

GROUP=at.aimon.memory
VERSION_NAME=0.1.0-SNAPSHOT

POM_URL=https://github.com/kangwoo/aimon-memory
POM_INCEPTION_YEAR=2026

# Matches aimon-core, which is this artifact's consumer, and is the license ADR 0005's clean-room
# boundary exists to keep available. NOTE: the repository still has no LICENSE file — add one before
# anything is published, because this POM is a claim about a file that does not yet exist.
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_DEVELOPER_ID=kangwoo
POM_DEVELOPER_NAME=kangwoo
POM_DEVELOPER_URL=https://github.com/kangwoo

POM_SCM_URL=https://github.com/kangwoo/aimon-memory
POM_SCM_CONNECTION=scm:git:git://github.com/kangwoo/aimon-memory.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/kangwoo/aimon-memory.git

# Publish MD5 and SHA1 checksums only, not SHA256 and SHA512 as well. Since Gradle 6 the default is all
# four, but Central requires only the first two and the extra pair is written for every file in the
# bundle, each `.asc` included. The property is internal to Gradle (no public API exists) and is read at
# publication time. "insecure" names the weaker checksums, not a weaker artifact: what proves the artifact
# is the detached GPG signature next to it, and that is unaffected.
systemProp.org.gradle.internal.publish.checksums.insecure=true
