spring:
  application:
    name: aimon-memory-api
  datasource:
    url: ${AIMON_MEMORY_DB_URL:jdbc:postgresql://localhost:5432/aimon_memory}
    username: ${AIMON_MEMORY_DB_USER:aimon_memory}
    password: ${AIMON_MEMORY_DB_PASSWORD:aimon_memory}
    hikari:
      maximum-pool-size: ${AIMON_MEMORY_DB_POOL:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Must match aimon.memory.embed.dimensions below: it is the width the vector columns are created with.
      embedding_dimensions: ${AIMON_MEMORY_EMBED_DIMENSIONS:1536}
  threads:
    virtual:
      # Every handler here is blocking JDBC plus, on one route, a long provider wait. Virtual threads
      # give the concurrency a reactive stack would, and leave the code and its stack traces readable.
      enabled: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${AIMON_MEMORY_PORT:8080}
  shutdown: graceful

management:
  server:
    # A separate port, not a path prefix. The auth interceptor only covers /v1/**, so metrics served
    # on the main connector are world-readable to anything that can reach the service. Moving them to
    # a port that is not published externally is the standard answer and needs no second auth scheme.
    port: ${AIMON_MEMORY_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

aimon:
  memory:
    jwt:
      # No default on purpose. A development default here is a signing key published in the repository:
      # a deployment that forgets the variable starts cleanly, signs production tokens with it, and
      # anyone who has read the source can mint an admin token. Startup fails instead — on a missing
      # secret as well as a short one.
      secret: ${AIMON_MEMORY_JWT_SECRET:}
      lifetime: 12h
    llm:
      provider: ${AIMON_MEMORY_LLM_PROVIDER:none}
      fallback-provider: ${AIMON_MEMORY_LLM_FALLBACK:none}
      open-ai-api-key: ${OPENAI_API_KEY:}
      open-ai-model: ${AIMON_MEMORY_OPENAI_MODEL:gpt-4.1-mini}
      anthropic-api-key: ${ANTHROPIC_API_KEY:}
      anthropic-model: ${AIMON_MEMORY_ANTHROPIC_MODEL:claude-opus-5}
    embed:
      provider: ${AIMON_MEMORY_EMBED_PROVIDER:hashing}
      api-key: ${OPENAI_API_KEY:}
      dimensions: ${AIMON_MEMORY_EMBED_DIMENSIONS:1536}
    text:
      korean-user-dictionary: ${AIMON_MEMORY_NORI_USER_DICT:}

logging:
  level:
    at.aimon.memory: ${AIMON_MEMORY_LOG_LEVEL:INFO}
