spring:
  application:
    name: aimon-memory-api
  datasource:
    url: ${AIMON_MEMORY_DB_URL:jdbc:postgresql://localhost:5432/aimon_memory}
    username: ${AIMON_MEMORY_DB_USER:aimon_memory}
    # This default is the compose stack's password, and it is a credential published in this
    # repository — the same objection the jwt.secret comment below refuses a default over. It is kept
    # only because the local flow the README documents is `docker compose up` then `java -jar`, and
    # the matching value lives in a compose file that no application property can reach.
    #
    # DatabaseCredentialCheck is what makes keeping it defensible: it refuses to start when this
    # value is still in use against a database that is not on this host, which is the deployment the
    # objection is actually about.
    password: ${AIMON_MEMORY_DB_PASSWORD:aimon_memory}
    hikari:
      maximum-pool-size: ${AIMON_MEMORY_DB_POOL:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Must match aimon.memory.embed.dimensions below: it is the width the vector columns are created with.
      embedding_dimensions: ${AIMON_MEMORY_EMBED_DIMENSIONS:1536}
  threads:
    virtual:
      # Every handler here is blocking JDBC plus, on one route, a long provider wait. Virtual threads
      # give the concurrency a reactive stack would, and leave the code and its stack traces readable.
      enabled: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${AIMON_MEMORY_PORT:8080}
  shutdown: graceful

management:
  server:
    # A separate port, not a path prefix. The auth interceptor only covers /v1/**, so metrics served
    # on the main connector are world-readable to anything that can reach the service. Moving them to
    # a port that is not published externally is the standard answer and needs no second auth scheme.
    port: ${AIMON_MEMORY_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  # Off unless asked for. The auth interceptor covers /v1/** only, so anything served on this connector
  # from outside that prefix answers whoever can reach the port — the same reasoning that put actuator on
  # its own. The description a consumer should be reading is the committed docs/openapi.json, which is
  # generated from the same configuration and reviewed in diffs; this endpoint is a convenience while
  # developing.
  #
  #   AIMON_MEMORY_OPENAPI=true  ->  /v3/api-docs
  #
  # There is no Swagger UI to switch: the build depends on springdoc's -api starter rather than -ui,
  # because the UI's webjar is served by Boot's static mapping whatever this flag says. See
  # gradle/libs.versions.toml.
  api-docs:
    enabled: ${AIMON_MEMORY_OPENAPI:false}

aimon:
  memory:
    jwt:
      # No default on purpose. A development default here is a signing key published in the repository:
      # a deployment that forgets the variable starts cleanly, signs production tokens with it, and
      # anyone who has read the source can mint an admin token. Startup fails instead — on a missing
      # secret as well as a short one.
      secret: ${AIMON_MEMORY_JWT_SECRET:}
      lifetime: 12h
    llm:
      provider: ${AIMON_MEMORY_LLM_PROVIDER:none}
      fallback-provider: ${AIMON_MEMORY_LLM_FALLBACK:none}
      open-ai-api-key: ${OPENAI_API_KEY:}
      open-ai-model: ${AIMON_MEMORY_OPENAI_MODEL:gpt-4.1-mini}
      anthropic-api-key: ${ANTHROPIC_API_KEY:}
      anthropic-model: ${AIMON_MEMORY_ANTHROPIC_MODEL:claude-opus-5}
    embed:
      provider: ${AIMON_MEMORY_EMBED_PROVIDER:hashing}
      api-key: ${OPENAI_API_KEY:}
      dimensions: ${AIMON_MEMORY_EMBED_DIMENSIONS:1536}
    text:
      korean-user-dictionary: ${AIMON_MEMORY_NORI_USER_DICT:}

logging:
  level:
    at.aimon.memory: ${AIMON_MEMORY_LOG_LEVEL:INFO}
