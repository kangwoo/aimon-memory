# Single source of truth for every dependency version in the build.
# Rule: no module declares a version inline. If it is not here, it is not used.

[versions]
java            = "21"       # virtual threads are GA; bump to 25 when the toolchain is provisioned
springBoot      = "3.5.16"
springDepMgmt   = "1.1.7"
jooq            = "3.20.18"
pgvector        = "0.1.6"
lucene          = "10.5.1"
jtokkit         = "1.1.0"
nanojson        = "1.9"
testcontainers  = "1.21.4"
archunit        = "1.5.0"
jjwt            = "0.12.7"
assertj         = "3.27.6"
spotless        = "6.25.0"
checkstyle      = "10.12.5"
mavenPublish    = "0.30.0"

# aimon-core is the consumer, and its floor is Java 17. Only aimon-memory-client is compiled to it —
# every other module here is a service and stays on the toolchain above. Kept as a version rather than a
# literal so the two numbers that have to move together sit next to each other.
javaCompat      = "17"
# The aimon-core this build compiles, tests and publishes against. 0.2.4 is the first release containing the
# five-tier `PeerMemory` API, and it is on Central — so a clone with an empty ~/.m2 resolves it like any other
# coordinate. That is the property this line exists to hold: nothing on the path from `git clone` to `checkAll`
# may depend on an artifact only one machine has.
aimonCore       = "0.2.4"

# The contract suite's version, deliberately separate from the one above because the artifact is in a different
# state. `at.aimon.core:aimon-memory-testkit` is on no remote repository at all — it first ships in aimon-core
# 0.3.0, and the only copy that exists anywhere is whatever `publishToMavenLocal` left in a ~/.m2.
#
# Kept apart so that fact reaches exactly one place: the opt-in contract source set in aimon-memory-client, which
# skips itself when the coordinate does not resolve. Held as one version — the way it was until this line was
# split out — an unpublished artifact decides whether the whole repository compiles, and it decided no.
# Reproduce it from an aimon-core checkout with:
#   ./gradlew publishToMavenLocal -PVERSION_NAME=0.3.0-SNAPSHOT
# Collapse the two back into one when 0.3.0 is on Central and `aimonCore` can name it.
aimonTestkit    = "0.3.0-SNAPSHOT"

[libraries]
jooq              = { module = "org.jooq:jooq",                            version.ref = "jooq" }
pgvector          = { module = "com.pgvector:pgvector",                    version.ref = "pgvector" }
lucene-core       = { module = "org.apache.lucene:lucene-core",            version.ref = "lucene" }
lucene-analysis   = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }
lucene-nori       = { module = "org.apache.lucene:lucene-analysis-nori",   version.ref = "lucene" }
jtokkit           = { module = "com.knuddels:jtokkit",                     version.ref = "jtokkit" }
jjwt-api          = { module = "io.jsonwebtoken:jjwt-api",                 version.ref = "jjwt" }
jjwt-impl         = { module = "io.jsonwebtoken:jjwt-impl",                version.ref = "jjwt" }
jjwt-jackson      = { module = "io.jsonwebtoken:jjwt-jackson",             version.ref = "jjwt" }
tc-bom            = { module = "org.testcontainers:testcontainers-bom",    version.ref = "testcontainers" }
tc-postgres       = { module = "org.testcontainers:postgresql",            version.ref = "testcontainers" }
tc-junit          = { module = "org.testcontainers:junit-jupiter",         version.ref = "testcontainers" }
archunit          = { module = "com.tngtech.archunit:archunit-junit5",     version.ref = "archunit" }
aimon-core        = { module = "at.aimon.core:aimon-core",                 version.ref = "aimonCore" }
# The five-tier PeerMemory contract suite, published by aimon-core so backends outside that repository can run
# it. Referenced by GAV and never as a project: `:aimon-memory-testkit` in THIS build is an unrelated internal
# module of the same name (settings.gradle.kts), and `project(":aimon-memory-testkit")` would pick it up
# silently — a green build measuring the wrong thing.
aimon-testkit     = { module = "at.aimon.core:aimon-memory-testkit",      version.ref = "aimonTestkit" }
assertj           = { module = "org.assertj:assertj-core",                 version.ref = "assertj" }

[plugins]
springBoot    = { id = "org.springframework.boot",                  version.ref = "springBoot" }
springDepMgmt = { id = "io.spring.dependency-management",           version.ref = "springDepMgmt" }
spotless      = { id = "com.diffplug.spotless",                     version.ref = "spotless" }
mavenPublish  = { id = "com.vanniktech.maven.publish",              version.ref = "mavenPublish" }
