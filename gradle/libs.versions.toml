# Single source of truth for every dependency version in the build.
# Rule, and it runs both ways: no module declares a version inline, and nothing sits here that no module
# declares. Four entries once did — jooq, pgvector, nanojson, a Testcontainers BOM — left over from the
# build plan's dependency draft and from coordinates that ended up written out longhand. The cost is not
# the unused line. It is that someone asking what this project persists with, or parses JSON with, found
# an answer here, in the most authoritative-looking file in the build, and it was the wrong one.

[versions]
java            = "21"       # virtual threads are GA; bump to 25 when the toolchain is provisioned
springBoot      = "3.5.16"
springDepMgmt   = "1.1.7"
lucene          = "10.5.1"
jtokkit         = "1.1.0"
testcontainers  = "1.21.4"
archunit        = "1.5.0"
jjwt            = "0.13.0"
# The last 2.x line, and the one that targets Spring Boot 3.5. springdoc 3.x is built against Boot 4 —
# it depends on `spring-boot-webmvc` and `spring-boot-health`, modules that do not exist here — so this
# version moves when `springBoot` does and not before.
#
# `-api`, not `-ui`. The UI starter pulls org.webjars:swagger-ui, and Boot's default /webjars/** mapping
# then serves 179KB of it on the service port with no token — under a flag that says the description is
# off, and regardless of what that flag says. The document is the deliverable; a UI can be pointed at
# docs/openapi.json locally.
springdoc       = "2.9.0"
assertj         = "3.27.7"
spotless        = "6.25.0"
checkstyle      = "10.12.5"
mavenPublish    = "0.30.0"

# aimon-core is the consumer, and its floor is Java 17. Only aimon-memory-client is compiled to it —
# every other module here is a service and stays on the toolchain above. Kept as a version rather than a
# literal so the two numbers that have to move together sit next to each other.
javaCompat      = "17"
# The aimon-core this build compiles, tests and publishes against. 0.2.4 is the first release containing the
# five-tier `PeerMemory` API, and it is on Central — so a clone with an empty ~/.m2 resolves it like any other
# coordinate. That is the property this line exists to hold: nothing on the path from `git clone` to `checkAll`
# may depend on an artifact only one machine has.
aimonCore       = "0.2.4"

# The contract suite's version, deliberately separate from the one above because the artifact is in a different
# state. `at.aimon.core:aimon-memory-testkit` is published only as `0.3.0-SNAPSHOT`, on Central's snapshot
# repository — which settings.gradle.kts and the root build.gradle.kts point at for this one coordinate, so it
# resolves on a fresh clone and on CI. What it is not is *released*: a snapshot can be replaced or rotated away
# under the same version string, and nothing here would notice until a build failed.
#
# That is why it stays apart from `aimonCore`, which names a release. The separation keeps the unreleased
# coordinate reachable from exactly one place — the opt-in contract source set in aimon-memory-client, which
# skips itself when it does not resolve — and off this module's compile classpath, which is what gets published.
# Held as one version, the way it was until this line was split out, an unreleased artifact decides whether the
# whole repository compiles; it decided no, on every machine that had not run `publishToMavenLocal`.
#
# Collapse the two back into one when aimon-core 0.3.0 is *released* to Central and `aimonCore` can name it.
# The snapshot repository blocks in settings.gradle.kts and build.gradle.kts come out in the same change.
aimonTestkit    = "0.3.0-SNAPSHOT"

[libraries]
lucene-core       = { module = "org.apache.lucene:lucene-core",            version.ref = "lucene" }
lucene-analysis   = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }
lucene-nori       = { module = "org.apache.lucene:lucene-analysis-nori",   version.ref = "lucene" }
jtokkit           = { module = "com.knuddels:jtokkit",                     version.ref = "jtokkit" }
jjwt-api          = { module = "io.jsonwebtoken:jjwt-api",                 version.ref = "jjwt" }
jjwt-impl         = { module = "io.jsonwebtoken:jjwt-impl",                version.ref = "jjwt" }
jjwt-jackson      = { module = "io.jsonwebtoken:jjwt-jackson",             version.ref = "jjwt" }
springdoc         = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
tc-postgres       = { module = "org.testcontainers:postgresql",            version.ref = "testcontainers" }
tc-junit          = { module = "org.testcontainers:junit-jupiter",         version.ref = "testcontainers" }
archunit          = { module = "com.tngtech.archunit:archunit-junit5",     version.ref = "archunit" }
aimon-core        = { module = "at.aimon.core:aimon-core",                 version.ref = "aimonCore" }
# The five-tier PeerMemory contract suite, published by aimon-core so backends outside that repository can run
# it. Referenced by GAV and never as a project: `:aimon-memory-testkit` in THIS build is an unrelated internal
# module of the same name (settings.gradle.kts), and `project(":aimon-memory-testkit")` would pick it up
# silently — a green build measuring the wrong thing.
aimon-testkit     = { module = "at.aimon.core:aimon-memory-testkit",      version.ref = "aimonTestkit" }
assertj           = { module = "org.assertj:assertj-core",                 version.ref = "assertj" }

[plugins]
springBoot    = { id = "org.springframework.boot",                  version.ref = "springBoot" }
springDepMgmt = { id = "io.spring.dependency-management",           version.ref = "springDepMgmt" }
spotless      = { id = "com.diffplug.spotless",                     version.ref = "spotless" }
mavenPublish  = { id = "com.vanniktech.maven.publish",              version.ref = "mavenPublish" }
