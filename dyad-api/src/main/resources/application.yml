spring:
  application:
    name: dyad-api
  datasource:
    url: ${DYAD_DB_URL:jdbc:postgresql://localhost:5432/dyad}
    username: ${DYAD_DB_USER:dyad}
    password: ${DYAD_DB_PASSWORD:dyad}
    hikari:
      maximum-pool-size: ${DYAD_DB_POOL:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      # Every handler here is blocking JDBC plus, on one route, a long provider wait. Virtual threads
      # give the concurrency a reactive stack would, and leave the code and its stack traces readable.
      enabled: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${DYAD_PORT:8080}
  shutdown: graceful

management:
  server:
    # A separate port, not a path prefix. The auth interceptor only covers /v1/**, so metrics served
    # on the main connector are world-readable to anything that can reach the service. Moving them to
    # a port that is not published externally is the standard answer and needs no second auth scheme.
    port: ${DYAD_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

dyad:
  jwt:
    # Startup fails on a short secret rather than silently running with a weak key.
    secret: ${DYAD_JWT_SECRET:change-me-this-development-secret-is-32b}
    lifetime: 12h
  llm:
    provider: ${DYAD_LLM_PROVIDER:none}
    fallback-provider: ${DYAD_LLM_FALLBACK:none}
    open-ai-api-key: ${OPENAI_API_KEY:}
    open-ai-model: ${DYAD_OPENAI_MODEL:gpt-4.1-mini}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${DYAD_ANTHROPIC_MODEL:claude-sonnet-4-5}
  embed:
    provider: ${DYAD_EMBED_PROVIDER:hashing}
    api-key: ${OPENAI_API_KEY:}
  text:
    korean-user-dictionary: ${DYAD_NORI_USER_DICT:}

logging:
  level:
    dev.dyad: ${DYAD_LOG_LEVEL:INFO}
