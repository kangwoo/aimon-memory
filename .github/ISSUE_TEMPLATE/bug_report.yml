name: 버그 신고
description: 무언가 기대와 다르게 동작합니다
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **보안 취약점은 여기 올리지 마세요.** 이슈는 공개됩니다.
        [SECURITY.md](https://github.com/kangwoo/aimon-memory/blob/main/SECURITY.md) 의 비공개 신고 절차를 따라 주세요.

  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요
      description: 무엇을 기대했고 대신 무엇이 일어났는지 적어 주세요.
      placeholder: |
        recall 이 ent 신호를 항상 0으로 돌려줍니다. 같은 엔티티를 공유하는 결론이 있는데도요.
    validations:
      required: true

  - type: dropdown
    id: gate
    attributes:
      label: 어디에서 실패했나요
      description: 테스트가 아니라 실행 중에 발생했다면 "실행 중"을 고르세요.
      options:
        - "./gradlew checkAll"
        - "./gradlew integrationTest"
        - ":aimon-memory-client:contractTest"
        - ":aimon-memory-worker:loadTest"
        - "./scripts/smoke.sh"
        - "실행 중 (API 또는 worker)"
        - "빌드나 의존성 해석"
        - "기타"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 실제로 친 명령이나 보낸 요청을 그대로 붙여 주세요. 한 줄로 재현되면 그 한 줄이면 됩니다.
      render: shell
      placeholder: |
        ./gradlew :aimon-memory-recall:integrationTest --tests '*SignalTest*'
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 오류 출력
      description: 스택 트레이스나 테스트 리포트의 관련 부분. 길면 접어서 붙여도 됩니다.
      render: text

  - type: input
    id: commit
    attributes:
      label: 커밋 또는 브랜치
      description: "`git rev-parse --short HEAD` 의 결과"
      placeholder: "aba6f74"
    validations:
      required: true

  - type: input
    id: jdk
    attributes:
      label: JDK
      description: "`java -version` 의 결과. 이 빌드는 21을 요구합니다."
      placeholder: "temurin 21.0.5"
    validations:
      required: true

  - type: input
    id: postgres
    attributes:
      label: Postgres / pgvector
      description: 데이터베이스가 관련된 문제라면 적어 주세요. Testcontainers 를 쓴 경우 그렇다고만 적어도 됩니다.
      placeholder: "pgvector/pgvector:pg16 (docker compose) 또는 Testcontainers"

  - type: dropdown
    id: llm-mode
    attributes:
      label: AIMON_MEMORY_LLM_MODE
      description: 설정하지 않았다면 replay 입니다. 그게 기본값입니다.
      options:
        - replay
        - record
        - live
        - 모르겠음 / 관련 없음

  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: "macOS 15.5 (arm64) / Ubuntu 24.04"

  - type: textarea
    id: notes
    attributes:
      label: 그 밖에
      description: 짐작 가는 원인, 관련 있어 보이는 설정, 시도해 본 우회 방법.
