# 주 1회. 버전은 gradle/libs.versions.toml 한 곳에만 있으므로 dependabot 의 PR 도 그 파일 한 줄을
# 고친다 — 카탈로그를 단일 출처로 둔 것이 여기서 값을 한다.
#
# buildSrc 는 자기 빌드라 별도 항목이다. spotless·dependency-management·maven-publish 의 플러그인
# 마커가 거기에 있고, 그 버전들 역시 루트 카탈로그에서 읽으므로 두 항목이 같은 파일을 본다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # 같이 움직여야 하는 것들을 한 PR 로 묶는다. Lucene 은 core·analysis-common·nori 가
      # 한 버전이어야 하고, jjwt 는 api·impl·jackson 이, Testcontainers 는 BOM 과 모듈들이 그렇다.
      lucene:
        patterns: ["org.apache.lucene:*"]
      jjwt:
        patterns: ["io.jsonwebtoken:*"]
      testcontainers:
        patterns: ["org.testcontainers:*"]
      spring:
        patterns: ["org.springframework.boot:*", "io.spring.dependency-management:*"]
    ignore:
      # aimon-core 는 이 저장소가 구현하는 계약이다. 버전을 올리는 것은 의존성 갱신이 아니라
      # 어떤 API 에 맞출지에 대한 결정이고, `:aimon-memory-client:verifyCoreIsReleased` 와
      # 계약 스위트가 함께 봐야 한다. 사람이 판단한다.
      - dependency-name: "at.aimon.core:*"

      # springdoc 3.x 는 Spring Boot 4 를 대상으로 빌드된다 — `spring-boot-webmvc` 와
      # `spring-boot-health` 를 의존하는데, 이 빌드의 Boot 3.5 클래스패스에는 그 모듈이 없다.
      # PR #2 (2.9.0 → 3.1.0) 가 그것을 실제로 보여줬다: 컴파일도 fast gate 도 통과하고,
      # integration 에서 ApplicationContext 가 뜨지 않으면서 15개가
      # `ApplicationServletEnvironment` NoClassDefFoundError 로 무너졌다. 조용히 통과할 수
      # 있는 종류의 실패가 아니라는 뜻이기도 하다.
      #
      # 막는 것은 major 뿐이다. 2.x 안의 갱신은 계속 받는다. Boot 4 로 올릴 때 이 항목을 지우고,
      # gradle/libs.versions.toml 의 springdoc 주석도 같이 지운다 — 그 주석이 이미 같은 말을
      # 하고 있고("this version moves when `springBoot` does and not before"), 둘은 함께 움직인다.
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: "/buildSrc"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
