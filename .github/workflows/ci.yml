name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only, declared rather than inherited. Nothing in this workflow uses the token — there is no comment to
# post, no artifact to push, no release to cut — so the default permissions of whatever the repository happens
# to be set to are more than it needs. `release.yml` says the same thing for the same reason.
permissions:
  contents: read

env:
  # CI never talks to a live model. Recording is a deliberate local act.
  AIMON_MEMORY_LLM_MODE: replay

jobs:
  # The fast gate: formatting, style, the BOM's claim about itself, and the tests that need no daemon.
  # Everything here runs in under a minute, so a formatting mistake does not wait behind a database.
  #
  # It is also the only standing check that this repository can be built by someone who is not its
  # author. A runner has an empty ~/.m2, so anything reachable only through `publishToMavenLocal`
  # fails here and nowhere else — which is exactly what happened while `aimonCore` was pinned to a
  # snapshot. Keep it that way: no step here may populate the local Maven repository.
  #
  # One tier is knowingly not run. `:aimon-memory-client:contractTest` subclasses
  # `at.aimon.core:aimon-memory-testkit`, which ships first in aimon-core 0.3.0 and is on no remote
  # repository yet, so the source set skips itself here and says so in the log. A green run of this
  # job is not evidence that aimon-core's contract suite passed; that has to be run by hand until
  # the testkit is published, and CONTRIBUTING.md says so to anyone opening a pull request.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: checkAll
        run: ./gradlew checkAll --no-daemon

  # The tier where nearly all of this system's behaviour actually lives. A partial unique index, a
  # pgvector distance and a Flyway migration chain are not things a mock stands in for, so this is a
  # gate and not an optional extra — it is simply slower, and separated so the fast one stays fast.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Testcontainers starts pgvector itself, so there is no service container here and no difference
      # between how the suite runs in CI and how it runs on a laptop.
      - name: integrationTest
        run: ./gradlew integrationTest --no-daemon

      # Not part of either gate above: the timings it prints describe the runner, not the system, so
      # they are a measurement rather than a gate. Its assertions are a gate — concurrent writers to
      # one pair must produce no errors and a gap-free sequence, and dedup must still converge under
      # contention — so CI runs it at a small size instead of leaving it to be run by hand and
      # therefore never.
      - name: load (small)
        run: >
          ./gradlew :aimon-memory-worker:loadTest --no-daemon
          -Daimon.memory.load.pairs=8 -Daimon.memory.load.perPair=20

      - name: publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/build/reports/tests"
