name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers starts pgvector itself, so there is no service container here and no
      # difference between how the suite runs in CI and how it runs on a laptop.
      - name: check
        run: ./gradlew check --no-daemon
        env:
          # CI never talks to a live model. Recording is a deliberate local act.
          AIMON_MEMORY_LLM_MODE: replay

      # Not part of `check`: the timings it prints describe the runner, not the system, so they are a
      # measurement rather than a gate. Its assertions are a gate — concurrent writers to one pair
      # must produce no errors and a gap-free sequence, and dedup must still converge under
      # contention — so CI runs it at a small size instead of leaving it to be run by hand and
      # therefore never.
      - name: load (small)
        run: ./gradlew :aimon-memory-worker:loadTest --no-daemon -Daimon.memory.load.pairs=8 -Daimon.memory.load.perPair=20
        env:
          AIMON_MEMORY_LLM_MODE: replay

      - name: publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/test"
