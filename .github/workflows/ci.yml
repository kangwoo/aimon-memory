name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers starts pgvector itself, so there is no service container here and no
      # difference between how the suite runs in CI and how it runs on a laptop.
      - name: check
        run: ./gradlew check --no-daemon
        env:
          # CI never talks to a live model. Recording is a deliberate local act.
          DYAD_LLM_MODE: replay

      - name: publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/test"
