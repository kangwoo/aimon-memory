# Local dependencies. The image is pgvector's own build of Postgres 16 rather than stock postgres
# plus a manual extension install, so `CREATE EXTENSION vector` works on a fresh volume.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aimon-memory-postgres
    environment:
      POSTGRES_DB: aimon_memory
      POSTGRES_USER: aimon_memory
      POSTGRES_PASSWORD: aimon_memory
    ports:
      - "5432:5432"
    volumes:
      - aimon-memory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimon_memory -d aimon_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aimon-memory-postgres:
