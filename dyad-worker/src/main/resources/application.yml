spring:
  application:
    name: dyad-worker
  datasource:
    url: ${DYAD_DB_URL:jdbc:postgresql://localhost:5432/dyad}
    username: ${DYAD_DB_USER:dyad}
    password: ${DYAD_DB_PASSWORD:dyad}
    hikari:
      # Sized against worker concurrency, not request rate. Each work unit holds a connection only
      # around its queries, never across the model call, so this can stay small.
      maximum-pool-size: ${DYAD_DB_POOL:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Must match dyad.embed.dimensions below: it is the width the vector columns are created with.
      embedding_dimensions: ${DYAD_EMBED_DIMENSIONS:1536}
  threads:
    virtual:
      enabled: true

server:
  # The worker serves no API, so actuator is its entire HTTP surface and one port is enough. There is
  # nothing here to separate metrics from — unlike the API, where a second port keeps them off the
  # connector that answers /v1.
  port: ${DYAD_MANAGEMENT_PORT:9091}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

dyad:
  llm:
    provider: ${DYAD_LLM_PROVIDER:none}
    fallback-provider: ${DYAD_LLM_FALLBACK:none}
    open-ai-api-key: ${OPENAI_API_KEY:}
    open-ai-model: ${DYAD_OPENAI_MODEL:gpt-4.1-mini}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${DYAD_ANTHROPIC_MODEL:claude-opus-5}
  embed:
    provider: ${DYAD_EMBED_PROVIDER:hashing}
    api-key: ${OPENAI_API_KEY:}
    dimensions: ${DYAD_EMBED_DIMENSIONS:1536}
  text:
    korean-user-dictionary: ${DYAD_NORI_USER_DICT:}
  worker:
    concurrency: ${DYAD_WORKER_CONCURRENCY:4}
    units-per-poll: 8
    items-per-unit: 100
    claim-ttl: 5m
    min-poll-interval: 1s
    max-poll-interval: 30s
    max-attempts: 5
    reconciler-interval: 5m
    processed-retention: 7d

logging:
  level:
    dev.dyad: ${DYAD_LOG_LEVEL:INFO}
